name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish libaura
        run: cargo publish -p libaura --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Give crates.io a moment to index the base crate before dependents.
      - name: Wait for libaura to index
        run: sleep 30
      - name: Publish aura-onnx
        run: cargo publish -p aura-onnx --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish aura-cli
        run: cargo publish -p aura-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Cut GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

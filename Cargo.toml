[workspace]
resolver = "2"
members = [
    "tpt-aura",
    "tpt-aura-cli",
    "tpt-aura-onnx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tpt-org/aura"
authors = ["TPT Solutions"]
description = "Adaptive Universal Record Architecture — a cryptographically sealed, semantically-aware master media format."

[workspace.dependencies]
thiserror = "1.0"
sha3 = "0.10"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"

[workspace]
resolver = "2"
members = [
    "libaura",
    "aura-cli",
    "aura-onnx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tpt-org/aura"
authors = ["TPT Solutions"]
description = "Adaptive Universal Record Architecture — a cryptographically sealed, semantically-aware master media format."
keywords = ["media", "provenance", "c2pa", "wasm", "spatial"]
categories = ["multimedia", "encoding", "cryptography"]

[workspace.dependencies]
thiserror = "1.0"
sha3 = "0.10"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
